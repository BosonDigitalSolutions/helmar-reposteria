<div class="mb-4">
  <label class="mb-1 block text-sm font-semibold text-chocolate" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.errors %}
    <p class="mt-1 text-sm text-cherry" role="alert">{{ field.errors|striptags }}</p>
  {% endif %}
  {% if field.help_text %}
    <p class="mt-1 text-xs text-chocolate/70">{{ field.help_text }}</p>
  {% endif %}
</div>
