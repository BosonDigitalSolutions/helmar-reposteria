<div class="mb-4 flex items-center justify-between gap-3">
  <a class="rounded-full border border-chocolate/20 px-4 py-2 text-sm font-semibold text-chocolate" href="?anio={{ previous.0 }}&mes={{ previous.1 }}">Mes anterior</a>
  <h2 class="font-display text-2xl capitalize text-chocolate">{{ month_label }}</h2>
  <a class="rounded-full border border-chocolate/20 px-4 py-2 text-sm font-semibold text-chocolate" href="?anio={{ following.0 }}&mes={{ following.1 }}">Mes siguiente</a>
</div>
<div class="month-grid">
  {% for label in weekdays %}
    <div class="px-2 py-1 text-xs font-semibold uppercase tracking-widest text-chocolate/70">{{ label }}</div>
  {% endfor %}
  {% for week in weeks %}
    {% for day in week %}
      <div class="month-day rounded-2xl border border-chocolate/10 bg-white p-2 {% if not day.in_month %}text-chocolate/50{% endif %} {% if day.date == today %}border-coral/40{% endif %}">
        <a class="text-sm font-semibold text-chocolate" href="{{ day_url }}{{ day.date|date:'Y-m-d' }}{{ day_tail }}">{{ day.date.day }}</a>
        {% for item in day.items %}
          <a class="line-clamp mt-1 block text-xs text-cherry" href="{{ item.url }}">{{ item.label }}</a>
        {% endfor %}
      </div>
    {% endfor %}
  {% endfor %}
</div>
