{% extends "dashboard/base.html" %}

{% block title %}Eliminar{% endblock %}

{% block content %}
  <form method="post">
    {% csrf_token %}
    <section class="max-w-xl rounded-3xl border border-coral/40 bg-white p-8">
      <h1 class="font-display text-3xl text-chocolate">Eliminar</h1>
      <p class="mt-4 text-chocolate/80">¿Eliminar {{ object_label }}? Esta acción no se puede deshacer.</p>
      <div class="mt-6 flex gap-3">
        <button class="rounded-full bg-cherry px-4 py-2 text-sm font-semibold text-white" type="submit">Eliminar</button>
        <a class="rounded-full border border-chocolate/20 px-4 py-2 text-sm font-semibold text-chocolate" href="{{ cancel_url }}">Cancelar</a>
      </div>
    </section>
  </form>
{% endblock %}
