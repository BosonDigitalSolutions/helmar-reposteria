{% extends "dashboard/base.html" %}

{% block title %}Gasto{% endblock %}

{% block content %}
  <h1 class="font-display text-4xl text-chocolate">Gasto</h1>
  <form class="mt-6 max-w-xl" method="post">
    {% csrf_token %}
    {% for field in form.visible_fields %}
      {% include "components/field.html" with field=field %}
    {% endfor %}
    <button class="rounded-full bg-cherry px-4 py-2 text-sm font-semibold text-white" type="submit">Guardar</button>
  </form>
{% endblock %}
