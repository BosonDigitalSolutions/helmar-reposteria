{% extends "dashboard/base.html" %}

{% block title %}Reglas de duplicados{% endblock %}

{% block content %}
  <h1 class="mb-6 font-display text-4xl text-chocolate">Reglas de duplicados</h1>
  <form class="max-w-xl rounded-3xl bg-white p-6" method="post">
    {% csrf_token %}
    {% for field in form %}{% include "components/field.html" %}{% endfor %}
    <button class="rounded-full bg-cherry px-4 py-2 text-sm font-semibold text-white" type="submit">Guardar</button>
  </form>
{% endblock %}
