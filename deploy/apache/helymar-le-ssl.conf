<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName helymar.com
    ServerAlias www.helymar.com

    RewriteEngine on
    RewriteCond %{HTTP_HOST} ^www\.helymar\.com$ [NC]
    RewriteRule ^ https://helymar.com%{REQUEST_URI} [END,NE,R=permanent]

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8001/
    ProxyPassReverse / http://127.0.0.1:8001/
    RequestHeader set X-Forwarded-Proto "https"

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/helymar.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/helymar.com/privkey.pem
</VirtualHost>
</IfModule>
